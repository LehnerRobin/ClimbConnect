name: CI

# Läuft bei jedem Push auf main und bei jedem Pull Request
on:
  push:
    branches: ["main"]
  pull_request:

# Actions-Versionen: checkout@v7, setup-dotnet@v6, setup-node@v7 laufen selbst auf Node 24.
# (Node 20 wurde im September 2026 von GitHub Actions entfernt.)
# Das ist unabhängig von "node-version" unten – das ist die Node-Version für unser Angular-Frontend.
jobs:
  backend:
    name: Backend (Build + Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: .NET 8 einrichten
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Tests ausführen
        run: dotnet test backend/ClimbConnect.Tests/ClimbConnect.Tests.csproj

  frontend:
    name: Frontend (Build + Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Build
        run: npx ng build

      - name: Tests ausführen
        run: npx ng test --watch=false --browsers=ChromeHeadless
