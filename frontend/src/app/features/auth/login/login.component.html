<section class="auth-page">

  <app-page-band image="/assets/home/hero-kletterinnen.jpg" position="40% center" size="tall">
    <div class="auth-layout">

      <div class="auth-intro">
        <p class="cc-eyebrow">ClimbConnect</p>
        <h1 class="cc-h1">Schön, dass du<br><em>wieder da bist.</em></h1>
        <p class="cc-lead">Melde dich an, um dein Profil und deine Kletterdaten zu verwalten.</p>
      </div>

      <div class="auth-card">
        <span class="cc-hand auth-note" aria-hidden="true">hallo!</span>
        <h2 class="cc-h2 auth-title">Anmelden</h2>

        <form
          class="auth-form"
          novalidate
          (submit)="login(email.value, password.value); $event.preventDefault()">

          <div class="cc-field">
            <label for="email">E-Mail</label>
            <input
              id="email"
              class="cc-input"
              #email
              type="email"
              placeholder="deine.email@example.com"
              autocomplete="email">
          </div>

          <div class="cc-field">
            <label for="password">Passwort</label>
            <input
              id="password"
              class="cc-input"
              #password
              type="password"
              placeholder="Dein Passwort"
              autocomplete="current-password">
          </div>

          @if (errorMessage) {
            <div class="cc-msg cc-msg-error" role="alert">
              {{ errorMessage }}
              @if (showRegisterHint) {
                <a routerLink="/register" class="error-link">Noch kein Konto? Jetzt registrieren</a>
              }
            </div>
          }

          <button type="submit" class="cc-btn auth-button">
            Anmelden
          </button>

        </form>

        <p class="auth-switch">
          Noch kein Konto?
          <a routerLink="/register">Jetzt registrieren</a>
        </p>
      </div>

    </div>
  </app-page-band>

</section>
